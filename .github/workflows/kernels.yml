name: CPU kernel contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - compiler: clang-18
            sanitize: "OFF"
            multiversion: "ON"
          - compiler: gcc-14
            sanitize: "OFF"
            multiversion: "ON"
          - compiler: gcc-14
            sanitize: "ON"
            multiversion: "ON"
          - compiler: clang-18
            sanitize: "OFF"
            multiversion: "OFF"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install C23 compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.compiler }}
      - name: Configure
        run: >-
          cmake -S velri-lib -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DVELRI_SANITIZE=${{ matrix.sanitize }}
          -DVELRI_CPU_MULTIVERSION=${{ matrix.multiversion }}
          -DVELRI_BUILD_BENCHMARK=ON
          -DVELRI_BUILD_CPU_BENCHMARK=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Checked benchmark smoke test
        run: |
          ./build/bench_linear auto 3 33 17 1 3
          ./build/bench_cpu f64 auto 3 33 17 2 1 1 3
          ./build/bench_cpu i8 auto 1 33 17 2 0 1 3
  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            libc_arch: arm64
          - target: riscv64
            libc_arch: riscv64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          gcc-14-${{ matrix.target }}-linux-gnu
          libc6-dev-${{ matrix.libc_arch }}-cross qemu-user
      - run: >-
          cmake -S velri-lib -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/${{ matrix.target }}-linux-gnu.cmake
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  x86-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-14 qemu-user
      - run: >-
          cmake -S velri-lib -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-14 -DVELRI_CPU_MULTIVERSION=ON
      - run: cmake --build build --parallel 2
      # QEMU TCG does not implement AVX-512. Native tests exercise it when the
      # runner supports it. TCG also has masked-load fault-suppression issues:
      # keep the full guarded suite native, and exercise AVX2 dispatch separately.
      - name: Run the same binary on baseline and AVX2-only CPUs
        run: |
          for test in test_linear test_linear_typed test_ops; do
            qemu-x86_64 -cpu Nehalem "./build/$test"
          done
          qemu-x86_64 -cpu Nehalem ./build/test_contract base
          qemu-x86_64 -cpu Haswell,-hle,-rtm ./build/test_contract --dispatch avx2
